name: Blender Cloud Studio Runner

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      script_name:
        description: 'Nama script Python di folder scripts/'
        required: false
        default: 'demo_render.py'

jobs:
  blender-run:
    runs-on: ubuntu-latest
    name: Run Blender in GitHub Cloud

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Blender Environment
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y blender libglu1-mesa

      - name: Jalankan Render / Script
        run: |
          mkdir -p output
          echo "Menjalankan script demo_render.py untuk membuat .blend..."
          blender -b -P scripts/demo_render.py

          echo "Merender frame 1 dari file .blend yang telah dibuat..."
          blender -b blend_files/paduka_sambas.blend -o "//../output/paduka_sambas_####.png" -F PNG -f 1

          echo "Daftar isi folder output:"
          ls -la output/

      - name: Upload Hasil Render (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: blender-render-output
          path: output/
          retention-days: 14
