name: Blender Cloud Studio Runner

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  blender-run:
    runs-on: ubuntu-latest
    name: Run Blender in GitHub Cloud

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Blender Environment
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y blender

      - name: Buat Model 3D dan Render Gambar
        run: |
          mkdir -p output
          blender -b --python-expr "
          import bpy, math
          bpy.ops.wm.read_factory_settings(use_empty=True)
          bpy.ops.object.text_add(location=(0,0,0))
          txt = bpy.context.active_object
          txt.data.body = 'PADUKA SAMBAS'
          txt.data.align_x = 'CENTER'
          txt.data.align_y = 'MIDDLE'
          txt.data.extrude = 0.2
          txt.rotation_euler = (math.radians(90), 0, 0)
          bpy.ops.object.light_add(type='SUN', location=(5,-5,10))
          bpy.ops.object.camera_add(location=(0,-6,0.5))
          cam = bpy.context.active_object
          cam.rotation_euler = (math.radians(90), 0, 0)
          bpy.context.scene.camera = cam
          bpy.context.scene.render.engine = 'CYCLES'
          bpy.context.scene.cycles.samples = 16
          bpy.ops.wm.save_as_mainfile(filepath='scene.blend')
          "
          
          # Render frame 1 ke folder output
          blender -b scene.blend -o "output/paduka_sambas_render" -F PNG -f 1

          echo "Daftar hasil render:"
          ls -la output/

      - name: Upload Hasil Render (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: blender-render-output
          path: output/
          retention-days: 14
